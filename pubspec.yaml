name: nexus_bridge
description: P2P offline file transfer mobile app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking and Discovery
  udp: ^4.0.0
  uuid: ^4.0.0

  # Permissions
  permission_handler: ^11.4.0

  # Storage
  shared_preferences: ^2.1.0
  path_provider: ^2.0.15

  # State Management
  provider: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
